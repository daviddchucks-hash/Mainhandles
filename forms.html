<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forms — Handles</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" data-sidebar>
    <a href="dashboard.html" class="brand"><span class="brand-mark">H</span> Handles</a>
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="sidebar-link" data-nav-link="dashboard"><span class="icon">▦</span> Dashboard</a>
      <a href="websites.html" class="sidebar-link" data-nav-link="websites"><span class="icon">◧</span> Websites</a>
      <a href="forms.html" class="sidebar-link" data-nav-link="forms"><span class="icon">▤</span> Forms</a>
      <a href="submissions.html" class="sidebar-link" data-nav-link="submissions"><span class="icon">✉</span> Submissions</a>
      <a href="settings.html" class="sidebar-link" data-nav-link="settings"><span class="icon">⚙</span> Settings</a>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="sidebar-user-avatar" id="avatarInitial">·</div>
        <div data-user-name>—</div>
      </div>
      <button class="btn btn-ghost sidebar-logout" data-logout>Log out</button>
    </div>
  </aside>

  <main class="main-content">
    <div class="page-header">
      <div>
        <button class="menu-toggle" data-menu-toggle aria-label="Toggle menu">☰</button>
        <h1>Forms</h1>
        <p class="subtitle">Create forms and get the integration snippet for each one.</p>
      </div>
      <button class="btn btn-primary" id="openCreateBtn">+ Add form</button>
    </div>

    <div class="filters-bar">
      <select id="websiteFilter"><option value="">All websites</option></select>
    </div>

    <div class="card">
      <div id="formsWrap">
        <div class="loading-state"><div class="spinner"></div>Loading forms...</div>
      </div>
    </div>
  </main>
</div>

<!-- Create / Edit form modal -->
<div class="modal-overlay" id="formModal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitle">Add form</h2>
      <button class="modal-close" id="closeModalBtn">&times;</button>
    </div>
    <div class="modal-body">
      <div class="form-error" id="modalError"></div>
      <form id="formForm">
        <input type="hidden" id="formId">
        <div class="field">
          <label for="formWebsite">Website</label>
          <select id="formWebsite" required></select>
        </div>
        <div class="field">
          <label for="formName">Form name</label>
          <input type="text" id="formName" placeholder="Contact Form" required>
        </div>
        <div class="field">
          <label>Fields</label>
          <div id="fieldRows"></div>
          <button type="button" class="btn btn-secondary btn-sm" id="addFieldBtn">+ Add field</button>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="cancelModalBtn">Cancel</button>
      <button class="btn btn-primary" id="saveFormBtn">Save form</button>
    </div>
  </div>
</div>

<!-- Integration snippet modal -->
<div class="modal-overlay" id="snippetModal">
  <div class="modal">
    <div class="modal-header">
      <h2>Integration snippet</h2>
      <button class="modal-close" id="closeSnippetBtn">&times;</button>
    </div>
    <div class="modal-body">
      <p>Add this script once per page:</p>
      <div class="snippet"><button class="btn btn-ghost btn-sm snippet-copy" data-copy-target="scriptSnippet">Copy</button><span id="scriptSnippet"></span></div>
      <p style="margin-top:18px;">Tag your form with this ID:</p>
      <div class="snippet"><button class="btn btn-ghost btn-sm snippet-copy" data-copy-target="formSnippet">Copy</button><span id="formSnippet"></span></div>
      <p style="margin-top:18px;">Full example:</p>
      <div class="snippet"><button class="btn btn-ghost btn-sm snippet-copy" data-copy-target="fullSnippet">Copy</button><span id="fullSnippet"></span></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-primary" id="closeSnippetBtn2">Done</button>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script src="js/forms.js"></script>
</body>
</html>
