<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Handles integration demo</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="container" style="padding:60px 24px; max-width:520px;">
  <h1>Integration demo</h1>
  <p>This page is a stand-in for a customer's static website. Replace <code>YOUR_FORM_ID</code> below with a real form ID from your Handles dashboard to test end-to-end.</p>

  <div class="card card-pad">
    <form data-handles-form="YOUR_FORM_ID">
      <div class="field">
        <label for="demo-name">Name</label>
        <input type="text" id="demo-name" name="name" required>
      </div>
      <div class="field">
        <label for="demo-email">Email</label>
        <input type="email" id="demo-email" name="email" required>
      </div>
      <div class="field">
        <label for="demo-message">Message</label>
        <textarea id="demo-message" name="message"></textarea>
      </div>
      <button type="submit" class="btn btn-primary">Send</button>
    </form>
  </div>
</div>

<!-- This is the only script a real customer site needs to add. -->
<script src="https://mainhandles.onrender.com/forms.js"></script>
</body>
</html>
