<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — Handles</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="auth-shell">
  <div class="card auth-card">
    <a href="index.html" class="brand"><span class="brand-mark">H</span> Handles</a>
    <h1>Welcome back</h1>
    <p class="subtitle">Log in to your dashboard</p>

    <div class="form-error" id="formError"></div>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Log in</button>
    </form>

    <div class="auth-switch">Don't have an account? <a href="register.html">Sign up</a></div>
  </div>
</div>

<script src="js/api.js"></script>
<script>
  if (Auth.isLoggedIn()) window.location.href = 'dashboard.html';

  const form = document.getElementById('loginForm');
  const errorBox = document.getElementById('formError');
  const submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.classList.remove('is-visible');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Logging in...';

    try {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const { token, user } = await Api.login(email, password);
      Auth.setSession(token, user);
      window.location.href = 'dashboard.html';
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.classList.add('is-visible');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Log in';
    }
  });
</script>
</body>
</html>
