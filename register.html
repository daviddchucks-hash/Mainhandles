<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign up — Handles</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="auth-shell">
  <div class="card auth-card">
    <a href="index.html" class="brand"><span class="brand-mark">H</span> Handles</a>
    <h1>Create your account</h1>
    <p class="subtitle">Start collecting form submissions in minutes</p>

    <div class="form-error" id="formError"></div>

    <form id="registerForm" novalidate>
      <div class="field">
        <label for="name">Full name</label>
        <input type="text" id="name" name="name" autocomplete="name" required>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="new-password" required minlength="8">
        <div class="hint">At least 8 characters.</div>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Create account</button>
    </form>

    <div class="auth-switch">Already have an account? <a href="login.html">Log in</a></div>
  </div>
</div>

<script src="js/api.js"></script>
<script>
  if (Auth.isLoggedIn()) window.location.href = 'dashboard.html';

  const form = document.getElementById('registerForm');
  const errorBox = document.getElementById('formError');
  const submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.classList.remove('is-visible');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Creating account...';

    try {
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const { token, user } = await Api.register(name, email, password);
      Auth.setSession(token, user);
      window.location.href = 'dashboard.html';
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.classList.add('is-visible');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Create account';
    }
  });
</script>
</body>
</html>
